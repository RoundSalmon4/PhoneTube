name: Checks

on:
  workflow_dispatch:
  pull_request:
    types: [ opened, synchronize, reopened ]
  push:
    branches: [ main ]
    paths-ignore:
      - 'MediaServiceCore/**'
      - 'SharedModules/**'
      - '*.md'
      - 'LICENSE'
      - 'logs/**'
      - '.github/**'

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wrapper-validation:
    name: "Gradle Wrapper Validation"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate Gradle wrapper (non-blocking)
        # The runner cannot always reach services.gradle.org for checksums, so
        # treat a missed validation as a warning, not a failed check.
        continue-on-error: true
        uses: gradle/actions/wrapper-validation@v3

  unit-test:
    name: "Unit Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/**
          if-no-files-found: ignore

  detekt:
    name: "Detekt (soft)"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run detekt (soft)
        continue-on-error: true
        run: ./gradlew :app:detekt --no-daemon

      - name: Generate detekt baseline (soft)
        continue-on-error: true
        run: ./gradlew :app:detektBaseline --no-daemon

      - name: Upload detekt reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-reports
          path: app/build/reports/detekt/**
          if-no-files-found: ignore

      - name: Upload detekt baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-baseline
          path: app/config/detekt/baseline.xml
          if-no-files-found: ignore