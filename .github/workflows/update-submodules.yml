name: Update Submodules

on:
  schedule:
    - cron: '0 10 * * 1'  # every Monday at 10:00 UTC
  workflow_dispatch:

jobs:
  update-submodules:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.PAT }}
          persist-credentials: true

      - name: Update MediaServiceCore
        run: |
          cd MediaServiceCore
          git remote add upstream https://github.com/yuliskov/MediaServiceCore.git || true
          git fetch upstream
          LOCAL=$(git rev-parse HEAD)
          REMOTE=$(git rev-parse upstream/master)
          if [ "$LOCAL" != "$REMOTE" ]; then
            echo "MediaServiceCore has new commits: $LOCAL -> $REMOTE"
            git checkout upstream/master
          else
            echo "MediaServiceCore is up to date"
          fi

      - name: Update SharedModules
        run: |
          cd SharedModules
          git fetch origin
          LOCAL=$(git rev-parse HEAD)
          REMOTE=$(git rev-parse origin/master)
          if [ "$LOCAL" != "$REMOTE" ]; then
            echo "SharedModules has new commits: $LOCAL -> $REMOTE"
            git checkout origin/master
          else
            echo "SharedModules is up to date"
          fi

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet HEAD; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.PAT }}
          commit-message: 'chore: update submodules from upstream'
          branch: auto/update-submodules
          title: 'chore: update MediaServiceCore + SharedModules from upstream'
          body: |
            Automated submodule update from upstream repositories.

            **MediaServiceCore:** [yuliskov/MediaServiceCore](https://github.com/yuliskov/MediaServiceCore) (via [RoundSalmon4/MediaServiceCore](https://github.com/RoundSalmon4/MediaServiceCore))
            **SharedModules:** [yuliskov/SharedModules](https://github.com/yuliskov/SharedModules)

            This PR was created by the `update-submodules` workflow. The build will verify compilation.
          labels: automated
          delete-branch: true
