name: Update Submodules

on:
  schedule:
    - cron: '0 10 * * 1'  # every Monday at 10:00 UTC
  workflow_dispatch:

jobs:
  update-submodules:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.PAT }}
          persist-credentials: true

      - name: Update MediaServiceCore
        run: |
          cd MediaServiceCore
          git config user.name "roundsalmon4"
          git config user.email "209016228+RoundSalmon4@users.noreply.github.com"
          git remote add upstream https://github.com/yuliskov/MediaServiceCore.git || true
          git fetch upstream master
          git fetch origin phonetube-patch
          git fetch origin phonetube-patches
          # Our changes live on phonetube-patch as commits sitting on top of an upstream
          # master, so they get replayed onto whatever upstream is at today. The old setup
          # started from a frozen known-good upstream commit and copied whole pinned files
          # back out of a snapshot of our own fork, which threw away upstream's fixes to
          # those files and left the core pinned at that commit for good: the step compared
          # upstream master to our fork, they were never equal, and the rebuilt tree it
          # produced was identical to what was already there.
          git checkout -B auto/update-mediaservicecore upstream/master
          if ! git cherry-pick upstream/master..origin/phonetube-patch; then
            git cherry-pick --abort || true
            echo "ERROR: the PhoneTube patch no longer applies on top of upstream master."
            echo "Resolve it in the MediaServiceCore fork, rebase phonetube-patch onto"
            echo "upstream/master, push the branch, then re-run this workflow."
            exit 1
          fi
          # verify every patch made it into the working tree
          grep -q "2025-present RoundSalmon4" LICENSE || { echo "ERROR: MIT LICENSE missing"; exit 1; }
          grep -q "getPlaylist" mediaserviceinterfaces/src/main/java/com/liskovsoft/mediaserviceinterfaces/ContentService.java || { echo "ERROR: ContentService patch missing"; exit 1; }
          grep -q "getChannelPlaylistsObserve" mediaserviceinterfaces/src/main/java/com/liskovsoft/mediaserviceinterfaces/ContentService.java || { echo "ERROR: channel playlists interface patch missing"; exit 1; }
          grep -q "fun getPlaylist" youtubeapi/src/main/java/com/liskovsoft/youtubeapi/browse/v2/BrowseService2.kt || { echo "ERROR: BrowseService2 patch missing"; exit 1; }
          grep -q "fun getChannelPlaylists" youtubeapi/src/main/java/com/liskovsoft/youtubeapi/browse/v2/BrowseService2.kt || { echo "ERROR: channel playlists browse patch missing"; exit 1; }
          # The playlists tab only answers on the web client; the tv client ignores the params.
          grep -q "getChannelPlaylistsQuery(AppClient.WEB, channelId)" youtubeapi/src/main/java/com/liskovsoft/youtubeapi/browse/v2/BrowseService2.kt || { echo "ERROR: channel playlists must use the web client"; exit 1; }
          # Lockups are the item shape the playlists tab returns and must not be untyped.
          grep -q "getLockupItem()?.getPlaylistId() != null" youtubeapi/src/main/java/com/liskovsoft/youtubeapi/common/models/gen/CommonHelper.kt || { echo "ERROR: lockup type mapping missing"; exit 1; }
          grep -q "continueGroupObserve" youtubeapi/src/main/java/com/liskovsoft/youtubeapi/service/YouTubeContentService.java || { echo "ERROR: YouTubeContentService patch missing"; exit 1; }
          grep -q "getChannelPlaylistsObserve" youtubeapi/src/main/java/com/liskovsoft/youtubeapi/service/YouTubeContentService.java || { echo "ERROR: channel playlists service patch missing"; exit 1; }
          # The signed-out case must stay quiet: a null refresh token is normal.
          grep -q "else if (refreshToken != null)" youtubeapi/src/main/java/com/liskovsoft/youtubeapi/service/YouTubeSignInService.java || { echo "ERROR: YouTubeSignInService quiet signed-out patch missing"; exit 1; }
          grep -q 'android:required="false"' youtubeapi/src/main/AndroidManifest.xml || { echo "ERROR: manifest usb.host fix missing"; exit 1; }
          grep -q "setDurationMs" youtubeapi/src/main/java/com/liskovsoft/youtubeapi/service/data/YouTubeMediaItem.java || { echo "ERROR: YouTubeMediaItem patch missing"; exit 1; }
          grep -q "setDurationMs(first.getDurationMs())" youtubeapi/src/main/java/com/liskovsoft/youtubeapi/rss/RssService.kt || { echo "ERROR: RssService patch missing"; exit 1; }
          # Extended HLS is the one format flag we change, and it is turned on in two
          # places, so both are checked.
          grep -q "setFormatEnabled(FORMATS_ADAPTIVE | FORMATS_EXTENDED_HLS, true)" youtubeapi/src/main/java/com/liskovsoft/youtubeapi/service/internal/MediaServiceData.java || { echo "ERROR: extended HLS default patch missing"; exit 1; }
          grep -q "setFormatEnabled(FORMATS_EXTENDED_HLS, true)" youtubeapi/src/main/java/com/liskovsoft/youtubeapi/service/internal/MediaServiceData.java || { echo "ERROR: extended HLS upgrade patch missing"; exit 1; }
          # The fallback moved into FormatInfoWrapper when upstream pulled format
          # selection out of YouTubeMediaItemService, so the check follows it.
          grep -q "formatInfo == null || formatInfo.isUnplayable()" youtubeapi/src/main/java/com/liskovsoft/youtubeapi/service/internal/FormatInfoWrapper.kt || { echo "ERROR: innertube fallback patch missing"; exit 1; }
          grep -q '"User-Agent", USER_AGENT_BROWSER' youtubeapi/src/main/java/com/liskovsoft/youtubeapi/app/nsigsolver/common/InfoExtractor.kt || { echo "ERROR: browser User-Agent patch missing"; exit 1; }
          # The client order is the main reason we patch this file at all, and a hand
          # merge can quietly take upstream's list instead, so check one of our entries.
          grep -q 'AppClient.WEB_EMBED, // Restricted (18+) videos, requires PoToken' youtubeapi/src/main/java/com/liskovsoft/youtubeapi/videoinfo/V2/VideoInfoService.java || { echo "ERROR: video client order patch missing"; exit 1; }
          grep -q "switchNextFormat(boolean force)" youtubeapi/src/main/java/com/liskovsoft/youtubeapi/videoinfo/V2/VideoInfoService.java || { echo "ERROR: switchNextFormat signature patch missing"; exit 1; }
          # Deliberately not upstream's check. Upstream only counts a video broken
          # when it is live and full HD; ours goes with the extended HLS default we
          # turn on, so it has to stay or the two fall out of step. It is easy to
          # lose this one when the file gets merged by hand, hence the check.
          grep -q 'getHlsManifestUrl() == null && getAdaptiveFormats() != null && !getAdaptiveFormats().isEmpty()' youtubeapi/src/main/java/com/liskovsoft/youtubeapi/videoinfo/models/VideoInfo.java || { echo "ERROR: extended HLS check patch missing"; exit 1; }
          # Skip the rebuild when it is content-identical to the core that main already
          # points at, so an unchanged upstream does not generate a new commit SHA and a
          # no-op PR. It has to compare against main's pointer and not against
          # phonetube-patches: the branch is pushed before the PR merges, so if a core PR
          # is ever closed without merging, comparing against the branch would report no
          # change and the job would go quiet until upstream happened to move again.
          # Compared across the whole tree, less the nested SharedModules pointer,
          # because PhoneTube builds against the root SharedModules.
          LOCKED=$(git -C .. rev-parse HEAD:MediaServiceCore)
          if git diff --quiet "$LOCKED" -- . ':(exclude)SharedModules'; then
            echo "Rebuilt state matches the core main points at ($LOCKED); no update needed"
            git checkout -f "$LOCKED"
          else
            echo "Core differs from what main points at: $LOCKED -> rebuilt"
            git add -A
            git commit -m "chore: sync phonetube-patches with upstream + apply patches" || echo "no changes to commit"
            # The rebuilt core lands on phonetube-patches, and the pointer change rides
            # into the PR below. Nothing reaches main until that PR passes CI, which is
            # the only place the core actually gets compiled.
            git push origin auto/update-mediaservicecore:phonetube-patches --force
          fi

      - name: Update SharedModules
        run: |
          cd SharedModules
          git fetch origin master
          LOCAL=$(git rev-parse HEAD)
          REMOTE=$(git rev-parse origin/master)
          if [ "$LOCAL" != "$REMOTE" ]; then
            echo "SharedModules has new commits: $LOCAL -> $REMOTE"
            git checkout origin/master
          else
            echo "SharedModules is up to date"
          fi

      - name: Check for submodule changes
        id: changes
        run: |
          CHANGED=$(git diff --name-only HEAD | tr '\n' ' ' | sed 's/[[:space:]]*$//')
          echo "changed submodules: $CHANGED"
          if [ -z "$CHANGED" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

          CORE=false
          SHARED=false
          case "$CHANGED" in *MediaServiceCore*) CORE=true ;; esac
          case "$CHANGED" in *SharedModules*) SHARED=true ;; esac

          # Both pointers can move in the same run, and only the core one does most
          # weeks, so the title follows whatever actually changed instead of always
          # claiming SharedModules.
          if [ "$CORE" = "true" ] && [ "$SHARED" = "true" ]; then
            echo "title=chore: update MediaServiceCore and SharedModules from upstream" >> "$GITHUB_OUTPUT"
          elif [ "$CORE" = "true" ]; then
            echo "title=chore: update MediaServiceCore from upstream" >> "$GITHUB_OUTPUT"
          elif [ "$SHARED" = "true" ]; then
            echo "title=chore: update SharedModules from upstream" >> "$GITHUB_OUTPUT"
          else
            echo "title=chore: update submodules from upstream" >> "$GITHUB_OUTPUT"
          fi

          {
            echo "body<<PAYLOAD"
            echo "Automated submodule update from upstream repositories."
            echo
            echo "**Changed:** \`$CHANGED\`"
            echo
            if [ "$CORE" = "true" ]; then
              echo "**MediaServiceCore:** [yuliskov/MediaServiceCore](https://github.com/yuliskov/MediaServiceCore)"
            fi
            if [ "$SHARED" = "true" ]; then
              echo "**SharedModules:** [yuliskov/SharedModules](https://github.com/yuliskov/SharedModules)"
            fi
            echo
            echo "The core pointer only moves once this PR merges, so the checks here are"
            echo "the thing that decides whether it is safe to take."
            echo "PAYLOAD"
          } >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.PAT }}
          # No skip directive here on purpose. A submodule pointer is a build input, so
          # the bump has to be built, and a skip directive in this message would travel
          # into the merge commit and suppress the build on main. Same reasoning as the
          # paths-ignore note in build.yml and checks.yml.
          commit-message: 'chore: update submodules from upstream'
          branch: auto/update-submodules
          title: ${{ steps.changes.outputs.title }}
          body: ${{ steps.changes.outputs.body }}
          labels: automated
          delete-branch: true

      - name: Create issue if workflow failed
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT }}
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ Submodule update workflow failed',
              body: 'The automated submodule update workflow failed. Please review manually.',
              labels: ['automated', 'bug']
            })
