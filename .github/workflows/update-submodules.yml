name: Update Submodules

on:
  schedule:
    - cron: '0 10 * * 1'  # every Monday at 10:00 UTC
  workflow_dispatch:

jobs:
  update-submodules:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.PAT }}
          persist-credentials: true

      - name: Update MediaServiceCore
        run: |
          cd MediaServiceCore
          git config user.name "roundsalmon4"
          git config user.email "209016228+RoundSalmon4@users.noreply.github.com"
          git remote add upstream https://github.com/yuliskov/MediaServiceCore.git || true
          git fetch upstream master
          git fetch origin phonetube-patches
          git fetch origin tag patches-3.0
          LOCAL=$(git rev-parse origin/phonetube-patches)
          REMOTE=$(git rev-parse upstream/master)
          if [ "$LOCAL" = "$REMOTE" ]; then
            echo "MediaServiceCore phonetube-patches is up to date with upstream"
            exit 0
          fi
          echo "MediaServiceCore upstream has new commits: $LOCAL -> $REMOTE"
          # start from upstream/master
          git checkout -b auto/update-mediaservicecore upstream/master
          # copy our patched files from the pinned known-good tag
          git checkout patches-3.0 -- \
            mediaserviceinterfaces/src/main/java/com/liskovsoft/mediaserviceinterfaces/ContentService.java \
            youtubeapi/src/main/AndroidManifest.xml \
            youtubeapi/src/main/java/com/liskovsoft/youtubeapi/browse/v2/BrowseApiHelper.kt \
            youtubeapi/src/main/java/com/liskovsoft/youtubeapi/browse/v2/BrowseService2.kt \
            youtubeapi/src/main/java/com/liskovsoft/youtubeapi/rss/RssService.kt \
            youtubeapi/src/main/java/com/liskovsoft/youtubeapi/service/YouTubeContentService.java \
            youtubeapi/src/main/java/com/liskovsoft/youtubeapi/service/data/YouTubeMediaItem.java \
            youtubeapi/src/main/java/com/liskovsoft/youtubeapi/service/internal/MediaServiceData.java \
            youtubeapi/src/main/java/com/liskovsoft/youtubeapi/videoinfo/V2/VideoInfoService.java \
            youtubeapi/src/main/java/com/liskovsoft/youtubeapi/videoinfo/models/VideoInfo.java
          # also copy CommonHelper.kt
          curl -sL "https://raw.githubusercontent.com/RoundSalmon4/MediaServiceCore/patches-3.0/youtubeapi/src/main/java/com/liskovsoft/youtubeapi/common/models/gen/CommonHelper.kt" -o youtubeapi/src/main/java/com/liskovsoft/youtubeapi/common/models/gen/CommonHelper.kt
          # verify every patch made it into the working tree
          grep -q "getPlaylist" mediaserviceinterfaces/src/main/java/com/liskovsoft/mediaserviceinterfaces/ContentService.java || { echo "ERROR: ContentService patch missing"; exit 1; }
          grep -q "fun getPlaylist" youtubeapi/src/main/java/com/liskovsoft/youtubeapi/browse/v2/BrowseService2.kt || { echo "ERROR: BrowseService2 patch missing"; exit 1; }
          grep -q "continueGroupObserve" youtubeapi/src/main/java/com/liskovsoft/youtubeapi/service/YouTubeContentService.java || { echo "ERROR: YouTubeContentService patch missing"; exit 1; }
          grep -q 'android:required="false"' youtubeapi/src/main/AndroidManifest.xml || { echo "ERROR: manifest usb.host fix missing"; exit 1; }
          grep -q "setDurationMs" youtubeapi/src/main/java/com/liskovsoft/youtubeapi/service/data/YouTubeMediaItem.java || { echo "ERROR: YouTubeMediaItem patch missing"; exit 1; }
          grep -q "setDurationMs(first.getDurationMs())" youtubeapi/src/main/java/com/liskovsoft/youtubeapi/rss/RssService.kt || { echo "ERROR: RssService patch missing"; exit 1; }
          # Skip the rebuild when the result is content-identical to the current branch,
          # so an unchanged upstream doesn't generate a new commit SHA and a no-op PR.
          if git diff --quiet origin/phonetube-patches -- mediaserviceinterfaces youtubeapi; then
            echo "Rebuilt state matches phonetube-patches; no update needed"
            git checkout -f origin/phonetube-patches
          else
            git add -A
            git commit -m "chore: sync phonetube-patches with upstream + apply patches" || echo "no changes to commit"
            # push to phonetube-patches
            git push origin auto/update-mediaservicecore:phonetube-patches --force
          fi

      - name: Update SharedModules
        run: |
          cd SharedModules
          git fetch origin master
          LOCAL=$(git rev-parse HEAD)
          REMOTE=$(git rev-parse origin/master)
          if [ "$LOCAL" != "$REMOTE" ]; then
            echo "SharedModules has new commits: $LOCAL -> $REMOTE"
            git checkout origin/master
          else
            echo "SharedModules is up to date"
          fi

      - name: Check for submodule changes
        id: changes
        run: |
          if git diff --quiet HEAD; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request for SharedModules only
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.PAT }}
          commit-message: 'chore: update submodules from upstream [skip ci]'
          branch: auto/update-submodules
          title: 'chore: update SharedModules from upstream'
          body: |
            Automated submodule update from upstream repositories.

            **SharedModules:** [yuliskov/SharedModules](https://github.com/yuliskov/SharedModules)
          labels: automated
          delete-branch: true

      - name: Create issue if workflow failed
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT }}
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ Submodule update workflow failed',
              body: 'The automated submodule update workflow failed. Please review manually.',
              labels: ['automated', 'bug']
            })
