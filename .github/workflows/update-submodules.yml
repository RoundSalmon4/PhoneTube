name: Update Submodules

on:
  schedule:
    - cron: '0 10 * * 1'  # every Monday at 10:00 UTC
  workflow_dispatch:

jobs:
  update-submodules:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.PAT }}
          persist-credentials: true

      - name: Update MediaServiceCore
        run: |
          cd MediaServiceCore
          git config user.name "roundsalmon4"
          git config user.email "209016228+RoundSalmon4@users.noreply.github.com"
          git remote add upstream https://github.com/yuliskov/MediaServiceCore.git || true
          git fetch upstream master
          git fetch origin phonetube-patches
          LOCAL=$(git rev-parse origin/phonetube-patches)
          REMOTE=$(git rev-parse upstream/master)
          if [ "$LOCAL" = "$REMOTE" ]; then
            echo "MediaServiceCore phonetube-patches is up to date with upstream"
            exit 0
          fi
          echo "MediaServiceCore upstream has new commits: $LOCAL -> $REMOTE"
          git checkout -b auto/update-mediaservicecore origin/phonetube-patches
          git merge upstream/master --allow-unrelated-histories --no-edit || {
            echo "Merge conflicts detected, resolving with upstream changes..."
            git diff --name-only --diff-filter=U | xargs git checkout --theirs
            git add -A
            git commit -m "chore: resolve merge conflicts with upstream" || echo "no changes to commit"
          }
          # download our patched CommonHelper.kt directly from our fork
          curl -sL "https://raw.githubusercontent.com/RoundSalmon4/MediaServiceCore/phonetube-patches/youtubeapi/src/main/java/com/liskovsoft/youtubeapi/common/models/gen/CommonHelper.kt" -o youtubeapi/src/main/java/com/liskovsoft/youtubeapi/common/models/gen/CommonHelper.kt
          git commit -m "fix: overwrite CommonHelper.kt with PhoneTube patches" || echo "no changes to commit"
          # push merged result to phonetube-patches so parent repo can fetch it
          git push origin auto/update-mediaservicecore:phonetube-patches

      - name: Update SharedModules
        run: |
          cd SharedModules
          git fetch origin master
          LOCAL=$(git rev-parse HEAD)
          REMOTE=$(git rev-parse origin/master)
          if [ "$LOCAL" != "$REMOTE" ]; then
            echo "SharedModules has new commits: $LOCAL -> $REMOTE"
            git checkout origin/master
          else
            echo "SharedModules is up to date"
          fi

      - name: Verify submodule reference exists
        id: verify
        run: |
          cd MediaServiceCore
          HEAD_SHA=$(git rev-parse HEAD)
          if git cat-file -e "$HEAD_SHA" 2>/dev/null; then
            echo "reference_valid=true" >> $GITHUB_OUTPUT
            echo "Submodule reference $HEAD_SHA exists locally"
          else
            echo "reference_valid=false" >> $GITHUB_OUTPUT
            echo "ERROR: Submodule reference $HEAD_SHA does not exist"
          fi

      - name: Check for submodule changes
        id: changes
        if: steps.verify.outputs.reference_valid == 'true'
        run: |
          if git diff --quiet HEAD; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true' && steps.verify.outputs.reference_valid == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.PAT }}
          commit-message: 'chore: update submodules from upstream [skip ci]'
          branch: auto/update-submodules
          title: 'chore: update MediaServiceCore + SharedModules from upstream'
          body: |
            Automated submodule update from upstream repositories.

            **MediaServiceCore:** synced to [upstream/master](https://github.com/yuliskov/MediaServiceCore), then `CommonHelper.kt` overwritten with our patched version to preserve `LockupItem.getVideoId()` fix.
            **SharedModules:** [yuliskov/SharedModules](https://github.com/yuliskov/SharedModules)

            If `CommonHelper.kt` conflicts with upstream changes, this PR will need manual review.
          labels: automated
          delete-branch: true

      - name: Create issue if merge failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ Submodule update failed',
              body: 'The automated submodule update workflow failed. This may indicate merge conflicts or other issues with upstream changes. Please review manually.',
              labels: ['automated', 'bug']
            })
