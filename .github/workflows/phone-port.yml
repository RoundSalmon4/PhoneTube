name: Build Phone Port APK

on:
  push:
    branches: [ "phone-port" ]
  pull_request:
    branches: [ "phone-port" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Gradle permissions
        run: chmod +x gradlew

      - name: Set up debug signing for release build
        run: echo -e "storeFile=/home/runner/.android/debug.keystore\nstorePassword=android\nkeyAlias=androiddebugkey\nkeyPassword=android" > keystore.properties

      - name: Build with Gradle
        run: ./gradlew clean assembleStfdroidRelease

      - name: Upload Universal APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SmartTube-Phone_${{ github.sha }}_universal
          path: ./smarttubetv/build/outputs/apk/stfdroid/release/*_universal.apk
          if-no-files-found: warn

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SmartTube-Phone_${{ github.sha }}_arm64
          path: ./smarttubetv/build/outputs/apk/stfdroid/release/*_arm64-v8a.apk
          if-no-files-found: warn

      - name: Upload ARMv7 APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SmartTube-Phone_${{ github.sha }}_armeabi-v7a
          path: ./smarttubetv/build/outputs/apk/stfdroid/release/*_armeabi-v7a.apk
          if-no-files-found: warn

      - name: Upload x86 APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SmartTube-Phone_${{ github.sha }}_x86
          path: ./smarttubetv/build/outputs/apk/stfdroid/release/*_x86.apk
          if-no-files-found: warn
