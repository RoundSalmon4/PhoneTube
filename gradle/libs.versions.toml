cronet-embedded = { group = "org.chromium.net", name = "cronet-embedded", version.ref = "cronet-embedded" }

# DNS
dnsjava = { group = "dnsjava", name = "dnsjava", version.ref = "dnsjava" }

# DiskLruCache
disklrucache = { group = "com.jakewharton", name = "disklrucache", version.ref = "disklrucache" }

# NetCipher
netcipher = { group = "info.guardianproject.netcipher", name = "netcipher", version.ref = "netcipher" }

